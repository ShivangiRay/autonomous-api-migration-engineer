services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports: ["8000:8000"]
    depends_on: [postgres, redis]
  web:
    image: node:20-alpine
    working_dir: /workspace/apps/web-dashboard
    command: sh -c "npm install && npm run dev"
    volumes: ["..:/workspace"]
    ports: ["5173:5173"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_migration
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

