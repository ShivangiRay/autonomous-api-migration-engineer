[project]
name = "autonomous-api-migration-engineer"
version = "0.1.0"
description = "Production-grade bootstrap for AI-assisted REST migration planning."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.24",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agents*", "apps*", "libs*"]
exclude = ["infra*", "tests*", "examples*"]
