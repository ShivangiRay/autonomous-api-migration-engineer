[project]
name = "autonomous-api-migration-engineer"
version = "0.1.1"
description = "Production-grade bootstrap for AI-assisted REST migration planning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Shivangi Rai", email = "shivangiray1703@gmail.com"}
]
keywords = [
  "api-migration",
  "grpc",
  "openapi",
  "protobuf",
  "event-driven-architecture",
  "agentic-ai",
  "rag"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "grpcio>=1.60",
  "protobuf>=5.0",
  "opentelemetry-api>=1.24",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "black>=24.0",
  "ruff>=0.3"
]

[project.urls]
Homepage = "https://github.com/ShivangiRay/autonomous-api-migration-engineer"
Repository = "https://github.com/ShivangiRay/autonomous-api-migration-engineer"
Issues = "https://github.com/ShivangiRay/autonomous-api-migration-engineer/issues"

[project.scripts]
migration-engineer = "autonomous_api_migration_engineer.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["autonomous_api_migration_engineer*", "agents*", "apps*", "libs*"]
exclude = ["infra*", "tests*", "examples*"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
