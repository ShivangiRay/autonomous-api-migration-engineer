[project]
name = "autonomous-api-migration-engineer"
version = "0.1.0"
description = "Production-grade bootstrap for AI-assisted REST migration planning."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "grpcio>=1.60",
  "protobuf>=5.0",
  "opentelemetry-api>=1.24",
  "prometheus-client>=0.20"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "black>=24.0",
  "ruff>=0.3"
]

[project.scripts]
migration-engineer = "libs.common.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agents*", "apps*", "libs*"]
exclude = ["infra*", "tests*", "examples*"]
